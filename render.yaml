services:
  - type: web
    name: policy-summarizer-api
    env: python
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_sm
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: HF_API_TOKEN
        sync: false
      - key: USE_HF_API
        value: "true"
      - key: PYTHON_VERSION
        value: "3.10.0"
